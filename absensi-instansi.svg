<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2354"/>
      <stop offset="100%" stop-color="#0A0E24"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#B87F1F"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- decorative dots -->
  <circle cx="50" cy="60" r="3" fill="#33C6B0" opacity=".5"/>
  <circle cx="350" cy="90" r="4" fill="#F2A93B" opacity=".5"/>
  <circle cx="360" cy="330" r="3" fill="#33C6B0" opacity=".5"/>
  <circle cx="40" cy="340" r="4" fill="#F2A93B" opacity=".4"/>

  <!-- phone / device frame -->
  <rect x="120" y="70" width="160" height="260" rx="22" fill="#12183B" stroke="#33C6B0" stroke-width="2.5" opacity="0.95"/>
  <rect x="134" y="94" width="132" height="180" rx="8" fill="#0A0E24"/>

  <!-- face verification circle on screen -->
  <circle cx="200" cy="150" r="34" fill="none" stroke="#F2A93B" stroke-width="3" stroke-dasharray="6 5"/>
  <circle cx="200" cy="142" r="12" fill="#A7AED0"/>
  <path d="M178 172 q22 -20 44 0" fill="none" stroke="#A7AED0" stroke-width="3" stroke-linecap="round"/>
  <path d="M228 128 l10 10 l-4 4 l-10 -10 z" fill="#33C6B0"/>
  <circle cx="240" cy="118" r="14" fill="#33C6B0"/>
  <path d="M234 118 l4 5 l8 -9" fill="none" stroke="#0A0E24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- status bars -->
  <rect x="150" y="196" width="100" height="10" rx="5" fill="#1B2354"/>
  <rect x="150" y="196" width="70" height="10" rx="5" fill="#33C6B0"/>
  <rect x="150" y="214" width="100" height="10" rx="5" fill="#1B2354"/>
  <rect x="150" y="214" width="45" height="10" rx="5" fill="#F2A93B"/>
  <rect x="150" y="232" width="100" height="10" rx="5" fill="#1B2354"/>
  <rect x="150" y="232" width="25" height="10" rx="5" fill="#8B2A2A"/>

  <!-- home indicator -->
  <rect x="180" y="288" width="40" height="5" rx="2.5" fill="#33C6B0" opacity=".6"/>

  <!-- geofence pin + radius, bottom-left -->
  <circle cx="86" cy="300" r="34" fill="none" stroke="#33C6B0" stroke-width="1.6" stroke-dasharray="4 4" opacity=".8"/>
  <path d="M86 274 c14 0 24 10 24 23 c0 16 -24 34 -24 34 c0 0 -24 -18 -24 -34 c0 -13 10 -23 24 -23 z" fill="#F2A93B"/>
  <circle cx="86" cy="296" r="8" fill="#0A0E24"/>

  <!-- clock icon, top-right -->
  <circle cx="322" cy="150" r="26" fill="#1B2354" stroke="#F2A93B" stroke-width="2.5"/>
  <line x1="322" y1="150" x2="322" y2="134" stroke="#F5F1E6" stroke-width="3" stroke-linecap="round"/>
  <line x1="322" y1="150" x2="333" y2="150" stroke="#F5F1E6" stroke-width="3" stroke-linecap="round"/>

  <!-- title text -->
  <text x="200" y="368" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="700" fill="#F5F1E6" text-anchor="middle">Absensi Digital Instansi</text>
</svg>
