name: Terapkan tema blog
on:
  workflow_dispatch:
  push:
    paths: ['drafts/**']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_blog_theme.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Terapkan tema blog baru"
          git push
