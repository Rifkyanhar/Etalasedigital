name: Terbit Artikel Otomatis

on:
  schedule:
    - cron: "0 1 * * 2,5"   # Selasa & Jumat, 08.00 WIB (ubah ke "0 1 * * *" kalau mau tiap hari)
  workflow_dispatch:         # tombol jalankan manual

permissions:
  contents: write

concurrency:
  group: terbit-artikel
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terbitkan artikel berikutnya
        run: python3 scripts/publish_next.py

      - name: Commit dan push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Terbit artikel otomatis"
            git push
          fi
