<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background gradient senada dengan tema navy situs -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1B2354"/>
      <stop offset="100%" stop-color="#0A0E24"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- ===== Jalan / garis dasar ===== -->
  <rect x="0" y="300" width="400" height="4" fill="#262F6E"/>

  <!-- ===== Keranjang belanja (kiri) ===== -->
  <g transform="translate(55,150)">
    <!-- badan keranjang -->
    <path d="M10 60 L20 150 L130 150 L140 60 Z" fill="#F2A93B"/>
    <path d="M10 60 L20 150 L130 150 L140 60 Z" fill="none" stroke="#B87F1F" stroke-width="3"/>
    <!-- garis anyaman keranjang -->
    <line x1="30" y1="70" x2="38" y2="150" stroke="#B87F1F" stroke-width="2" opacity="0.6"/>
    <line x1="55" y1="70" x2="58" y2="150" stroke="#B87F1F" stroke-width="2" opacity="0.6"/>
    <line x1="80" y1="70" x2="80" y2="150" stroke="#B87F1F" stroke-width="2" opacity="0.6"/>
    <line x1="105" y1="70" x2="102" y2="150" stroke="#B87F1F" stroke-width="2" opacity="0.6"/>
    <line x1="120" y1="70" x2="115" y2="150" stroke="#B87F1F" stroke-width="2" opacity="0.6"/>
    <!-- pegangan keranjang -->
    <path d="M35 60 Q75 -10 115 60" fill="none" stroke="#B87F1F" stroke-width="8" stroke-linecap="round"/>
    <!-- isi belanjaan: botol -->
    <rect x="30" y="20" width="16" height="45" rx="4" fill="#33C6B0"/>
    <rect x="34" y="10" width="8" height="14" rx="2" fill="#33C6B0"/>
    <!-- isi belanjaan: sayur/daun -->
    <ellipse cx="75" cy="35" rx="22" ry="28" fill="#4FB57F"/>
    <ellipse cx="65" cy="28" rx="10" ry="16" fill="#5FCB8F"/>
    <ellipse cx="86" cy="30" rx="10" ry="16" fill="#5FCB8F"/>
    <!-- isi belanjaan: roti -->
    <ellipse cx="112" cy="45" rx="20" ry="14" fill="#E8B96A"/>
    <path d="M96 45 Q104 35 112 45 Q120 35 128 45" fill="none" stroke="#B8873F" stroke-width="2"/>
  </g>

  <!-- ===== Motor kurir (kanan) ===== -->
  <g transform="translate(210,175)">
    <!-- roda -->
    <circle cx="20" cy="105" r="22" fill="#12183B" stroke="#A7AED0" stroke-width="4"/>
    <circle cx="130" cy="105" r="22" fill="#12183B" stroke="#A7AED0" stroke-width="4"/>
    <circle cx="20" cy="105" r="6" fill="#A7AED0"/>
    <circle cx="130" cy="105" r="6" fill="#A7AED0"/>

    <!-- body motor -->
    <path d="M15 100 L45 60 L95 60 L120 100 Z" fill="#262F6E"/>
    <path d="M45 60 L60 40 L80 40 L95 60 Z" fill="#33384F"/>

    <!-- kotak pengiriman di belakang -->
    <rect x="95" y="35" width="45" height="45" rx="6" fill="#33C6B0"/>
    <rect x="95" y="35" width="45" height="45" rx="6" fill="none" stroke="#0E8E7A" stroke-width="2"/>
    <path d="M100 55 L135 55" stroke="#0E8E7A" stroke-width="2"/>
    <path d="M117 40 L117 75" stroke="#0E8E7A" stroke-width="2"/>

    <!-- pengendara: badan (jaket kurir generik warna hijau) -->
    <path d="M55 60 Q50 25 70 15 Q90 25 85 60 Z" fill="#3BA85C"/>
    <!-- lengan ke arah setang -->
    <path d="M58 35 Q35 40 25 55" fill="none" stroke="#3BA85C" stroke-width="10" stroke-linecap="round"/>
    <!-- helm -->
    <circle cx="70" cy="8" r="16" fill="#1C2036"/>
    <path d="M56 8 Q70 -4 84 8" fill="none" stroke="#A7AED0" stroke-width="2"/>
    <rect x="58" y="6" width="24" height="8" rx="4" fill="#33C6B0" opacity="0.85"/>

    <!-- setang motor -->
    <line x1="15" y1="55" x2="35" y2="50" stroke="#12183B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ===== Garis kecepatan (kesan bergerak cepat) ===== -->
  <line x1="150" y1="230" x2="190" y2="230" stroke="#F2A93B" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="145" y1="250" x2="180" y2="250" stroke="#F2A93B" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <line x1="155" y1="270" x2="185" y2="270" stroke="#F2A93B" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>
