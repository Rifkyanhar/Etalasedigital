<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12183B"/>
      <stop offset="55%" stop-color="#1B2354"/>
      <stop offset="100%" stop-color="#0A0E24"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A93B"/>
      <stop offset="100%" stop-color="#B87F1F"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33C6B0"/>
      <stop offset="100%" stop-color="#1E8C7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#33C6B0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#33C6B0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- decorative grid dots -->
  <g opacity="0.15">
    <circle cx="30" cy="40" r="2.5" fill="#F5F1E6"/>
    <circle cx="60" cy="40" r="2.5" fill="#F5F1E6"/>
    <circle cx="90" cy="40" r="2.5" fill="#F5F1E6"/>
    <circle cx="330" cy="360" r="2.5" fill="#F5F1E6"/>
    <circle cx="360" cy="360" r="2.5" fill="#F5F1E6"/>
    <circle cx="300" cy="360" r="2.5" fill="#F5F1E6"/>
  </g>

  <!-- floating accent shapes -->
  <circle cx="350" cy="60" r="46" fill="url(#tealGrad)" opacity="0.18"/>
  <circle cx="40" cy="330" r="60" fill="url(#goldGrad)" opacity="0.14"/>

  <!-- phone / clipboard device -->
  <g filter="url(#softShadow)">
    <rect x="118" y="86" width="164" height="228" rx="22" fill="#EFEAD9"/>
    <rect x="118" y="86" width="164" height="228" rx="22" fill="#1B2354" opacity="0.04"/>
    <rect x="132" y="108" width="136" height="184" rx="10" fill="#0A0E24"/>
  </g>

  <!-- screen header bar -->
  <rect x="132" y="108" width="136" height="34" rx="10" fill="url(#tealGrad)"/>
  <text x="200" y="130" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="13" fill="#0A0E24">ABSENSI DIGITAL</text>

  <!-- clock icon -->
  <circle cx="200" cy="182" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
  <line x1="200" y1="182" x2="200" y2="166" stroke="#F5F1E6" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="200" y1="182" x2="212" y2="188" stroke="#F5F1E6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- attendance list rows -->
  <g font-family="Inter, sans-serif">
    <rect x="150" y="222" width="100" height="10" rx="5" fill="#262F6E"/>
    <circle cx="248" cy="227" r="7" fill="url(#tealGrad)"/>
    <path d="M245 227l2 2.5 5-5.5" stroke="#0A0E24" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="150" y="242" width="100" height="10" rx="5" fill="#262F6E"/>
    <circle cx="248" cy="247" r="7" fill="url(#tealGrad)"/>
    <path d="M245 247l2 2.5 5-5.5" stroke="#0A0E24" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="150" y="262" width="100" height="10" rx="5" fill="#262F6E"/>
    <circle cx="248" cy="267" r="7" fill="url(#goldGrad)"/>
    <path d="M245 267l2 2.5 5-5.5" stroke="#0A0E24" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- QR corner accent -->
  <g transform="translate(150,280)" opacity="0.9">
    <rect x="0" y="0" width="8" height="8" fill="#F2A93B"/>
    <rect x="10" y="0" width="8" height="8" fill="#F5F1E6"/>
    <rect x="0" y="10" width="8" height="8" fill="#F5F1E6"/>
    <rect x="10" y="10" width="8" height="8" fill="#F2A93B"/>
  </g>

  <!-- badge -->
  <g transform="translate(200,344)">
    <rect x="-72" y="-14" width="144" height="30" rx="15" fill="url(#goldGrad)"/>
    <text x="0" y="6" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="13" fill="#0A0E24">SISTEM ABSENSI GURU</text>
  </g>
</svg>
