<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buat Password Baru - NAFA Tech Member Area</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">N</div>
      <div class="brand-name">NAFA Tech</div>
    </div>
    <h1 class="title">Buat Password Baru</h1>
    <p class="subtitle">Masukkan password baru untuk akun kamu</p>

    <div id="alertBox" class="alert"></div>

    <form id="updateForm">
      <div class="form-group">
        <label for="password">Password Baru</label>
        <input type="password" id="password" required minlength="6" placeholder="Minimal 6 karakter">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Konfirmasi Password</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="Ulangi password">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Simpan Password</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script>
    const form = document.getElementById('updateForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'alert alert-' + type;
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('Password dan konfirmasi tidak sama.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Menyimpan...';
      alertBox.style.display = 'none';

      const { error } = await supabaseClient.auth.updateUser({ password: password });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Simpan Password';

      if (error) {
        showAlert(error.message, 'error');
        return;
      }

      showAlert('Password berhasil diubah! Mengarahkan ke login...', 'success');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    });
  </script>
</body>
</html>
