<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bani Moesa — Gerbang Akses</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --hijau-tua:#0f3d24; --hijau:#1a5c3a; --hijau-mid:#236b44; --hijau-muda:#2e8b57;
  --emas:#c9a84c; --emas-t:#e8c46a; --krem:#faf7f2; --krem2:#f0ebe1;
  --putih:#fff; --teks:#1c1c1c; --abu:#8a8a8a; --border:#e0d8cc; --merah:#c0392b;
  --r:16px; --sh-lg:0 12px 48px rgba(0,0,0,.14);
  --skin:#c98a5b; --skin-shadow:#a96b3e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
  background:linear-gradient(160deg,var(--hijau-tua) 0%, var(--hijau) 60%, var(--hijau-tua) 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding: clamp(16px, 4vw, 40px);
}

.gate-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap: clamp(4px, 2vw, 22px);
  width:100%;
  max-width:920px;
}

.char{
  width: clamp(70px, 20vw, 160px);
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
}
.char svg{ width:100%; height:100%; overflow:visible; display:block; }

.eye .pupil{ fill:var(--teks); transition: transform .12s ease-out; }
.hand{ transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .3s ease; transform-box:fill-box; transform-origin:center; opacity:0; }
.covering .hand-left, .covering .hand-right,
.peeking .hand-left, .peeking .hand-right{ opacity:1; }

.pointing-arm{ transition: opacity .3s ease; transform-box:fill-box; transform-origin:center; }
.covering .pointing-arm, .peeking .pointing-arm{ opacity:0; }

@keyframes nudge-left{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
@keyframes nudge-right{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
#char-man .pointing-arm{ animation: nudge-left 1.7s ease-in-out infinite; }
#char-woman .pointing-arm{ animation: nudge-right 1.7s ease-in-out infinite; }

.mouth{ transition: d .3s ease; }

/* ===== Bani Moesa site-gate card, replicated 1:1 from the site ===== */
.site-gate-box{
  position:relative;
  background:var(--putih);
  border-radius:var(--r);
  padding:2.2rem 1.7rem;
  width: clamp(220px, 56vw, 340px);
  flex-shrink:0;
  box-shadow:var(--sh-lg);
  text-align:center;
}
.site-gate-emblem{
  width:88px;height:88px;margin:0 auto .9rem;border-radius:50%;
  background:linear-gradient(135deg,var(--emas),var(--emas-t));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(201,168,76,.4);
}
.site-gate-title{font-family:'Playfair Display',serif;font-size:1.7rem;color:var(--hijau-tua);margin-bottom:.4rem;font-weight:700}
.site-gate-sub{font-size:.88rem;color:var(--abu);margin-bottom:1.5rem;line-height:1.55}
.gate-field{text-align:left;margin-bottom:14px}
.gate-field label{font-size:.78rem;color:var(--abu);font-weight:500}
.site-gate-input{
  width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:8px;
  font-family:inherit;font-size:1rem;margin-top:6px;color:var(--teks);outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.site-gate-input:focus{ border-color:var(--hijau); box-shadow:0 0 0 3px rgba(26,92,58,.15); }
.btn-masuk{
  width:100%;background:var(--hijau-tua);color:#fff;border:none;padding:14px;border-radius:10px;
  font-family:inherit;font-size:1.02rem;font-weight:700;cursor:pointer;margin-top:6px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .2s, transform .1s;
}
.btn-masuk:hover{background:var(--hijau)}
.btn-masuk:active{transform:scale(.98)}
.btn-masuk[disabled]{opacity:.75}
.spinner{width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:none}
.btn-masuk.loading .spinner{display:inline-block}
.btn-masuk.loading .btn-label{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.site-gate-err{color:var(--merah);font-size:.85rem;margin-top:12px;font-weight:600}
.site-gate-ok{color:var(--hijau);font-size:.85rem;margin-top:12px;font-weight:600}

/* Balon petunjuk yang muncul beberapa saat setelah halaman dibuka */
.hint-bubble{
  position:absolute;
  left:50%;
  top:-8px;
  transform:translate(-50%,-100%) translateY(10px);
  width:max-content;
  max-width:250px;
  background:var(--krem);
  border:1.5px solid var(--emas);
  color:var(--hijau-tua);
  font-size:.82rem;
  font-weight:600;
  line-height:1.4;
  text-align:center;
  padding:10px 16px;
  border-radius:14px;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease, transform .4s ease;
  z-index:5;
}
.hint-bubble::after{
  content:'';
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%) rotate(45deg);
  width:14px;height:14px;
  background:var(--krem);
  border-right:1.5px solid var(--emas);
  border-bottom:1.5px solid var(--emas);
}
.hint-bubble.show{
  opacity:1;
  transform:translate(-50%,-100%) translateY(-8px);
}

@media(max-width:420px){
  .site-gate-box{padding:1.7rem 1.1rem}
  .site-gate-title{font-size:1.4rem}
}
</style>
</head>
<body>

<div class="gate-row">
  <!-- MUSLIMAH — kiri -->
  <div class="char" id="char-woman"></div>

  <!-- FORM LOGIN BANI MOESA -->
  <div class="site-gate-box">
    <div class="hint-bubble" id="hint-bubble">Silahkan diisi ya untuk bisa login ke Web Bani Moesa 🙏</div>

    <div class="site-gate-emblem">
      <svg width="38" height="38" viewBox="0 0 38 38">
        <path d="M8 30 Q6 16 18 6 Q24 2 30 4 Q22 6 17 12 Q11 19 12 28 Q12 31 9 31 Q8 31 8 30 Z" fill="var(--hijau-tua)"/>
        <circle cx="27" cy="6" r="2.4" fill="var(--hijau-tua)"/>
      </svg>
    </div>
    <div class="site-gate-title">Bani Moesa</div>
    <div class="site-gate-sub">Masukkan username dan sandi keluarga untuk membuka website ini.</div>

    <form id="gate-form">
      <div class="gate-field">
        <label for="gateUser">Username</label>
        <input type="text" id="gateUser" class="site-gate-input" placeholder="Username" autocomplete="off">
      </div>
      <div class="gate-field">
        <label for="gatePass">Password</label>
        <input type="password" id="gatePass" class="site-gate-input" placeholder="Password" autocomplete="off">
      </div>
      <button type="submit" class="btn-masuk" id="gate-btn">
        <span class="spinner"></span>
        <span class="btn-label">Masuk →</span>
      </button>
      <div id="gate-status"></div>
    </form>
  </div>

  <!-- MUSLIM — kanan -->
  <div class="char" id="char-man"></div>
</div>

<script>
function buildCharacter(gender){
  const isMan = gender === 'man';

  const hijabBack = !isMan
    ? `<ellipse cx="110" cy="163" rx="76" ry="94" fill="var(--headwear)"/>`
    : ``;

  const peci = isMan
    ? `<path d="M58 122 Q110 52 162 122 Q162 98 110 90 Q58 98 58 122 Z" fill="var(--headwear)"/>
       <path d="M62 120 Q110 66 158 120" stroke="var(--garment-trim)" stroke-width="3" fill="none" opacity=".85"/>`
    : ``;

  const hijabDrape = !isMan
    ? `<path d="M48 236 Q36 300 54 384 L92 384 Q78 312 84 246 Z" fill="var(--headwear)"/>
       <path d="M172 236 Q184 300 166 384 L128 384 Q142 312 136 246 Z" fill="var(--headwear)"/>
       <circle cx="110" cy="226" r="5.5" fill="var(--garment-trim)"/>`
    : ``;

  const beard = isMan
    ? `<path d="M60 208 Q54 262 110 278 Q166 262 160 208 Q160 252 130 262 Q140 237 132 224 Q120 246 110 250 Q100 246 90 224 Q82 237 92 262 Q60 252 60 208 Z" fill="#3b2a20" opacity=".92"/>`
    : ``;

  const blush = !isMan
    ? `<ellipse cx="78" cy="188" rx="9" ry="5.5" fill="#e0785a" opacity=".28"/>
       <ellipse cx="142" cy="188" rx="9" ry="5.5" fill="#e0785a" opacity=".28"/>`
    : ``;

  const lashes = !isMan
    ? `<path d="M76 151 L69 146" stroke="#3b2a20" stroke-width="2" stroke-linecap="round"/>
       <path d="M144 151 L151 146" stroke="#3b2a20" stroke-width="2" stroke-linecap="round"/>`
    : ``;

  const eyeRx = isMan ? 13.5 : 15;
  const eyeRy = isMan ? 10 : 11.5;
  const browPath = isMan
    ? `<path d="M76 138 Q90 129 104 137" stroke="#3b2a20" stroke-width="4.4" fill="none" stroke-linecap="round"/>
       <path d="M116 137 Q130 129 144 138" stroke="#3b2a20" stroke-width="4.4" fill="none" stroke-linecap="round"/>`
    : `<path d="M75 140 Q90 130 105 138" stroke="#3b2a20" stroke-width="3.4" fill="none" stroke-linecap="round"/>
       <path d="M115 138 Q130 130 145 140" stroke="#3b2a20" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;

  // Pointing arm = the arm closest to the login form (man: his left, woman: her right).
  // Relaxed arm = the outer arm, hanging at the side.
  const pointingArm = isMan
    ? `<g class="pointing-arm">
         <path d="M70 266 C46 274 32 292 28 316 C26 330 28 340 36 346 L48 344 C42 328 44 308 58 292 C66 283 74 280 84 278 Z" fill="var(--garment)"/>
         <path d="M20 340 C10 344 0 350 -8 358 C-11 361 -10 366 -5 367 C4 369 16 364 26 356 C32 351 32 344 26 341 C24 340 22 340 20 340 Z" fill="var(--skin)"/>
       </g>`
    : `<g class="pointing-arm">
         <path d="M150 266 C174 274 188 292 192 316 C194 330 192 340 184 346 L172 344 C178 328 176 308 162 292 C154 283 146 280 136 278 Z" fill="var(--garment)"/>
         <path d="M200 340 C210 344 220 350 228 358 C231 361 230 366 225 367 C216 369 204 364 194 356 C188 351 188 344 194 341 C196 340 198 340 200 340 Z" fill="var(--skin)"/>
       </g>`;

  const relaxedArm = isMan
    ? `<g class="hand-outer">
         <path d="M148 266 C172 285 180 330 168 385 C165 398 160 408 150 412 C142 408 138 398 138 386 C138 340 132 300 128 280 Z" fill="var(--garment)"/>
         <path d="M146 404 C158 400 166 408 164 420 C162 434 148 442 136 438 C126 434 122 422 128 412 C132 406 140 404 146 404 Z" fill="var(--skin)"/>
       </g>`
    : `<g class="hand-outer">
         <path d="M72 266 C48 285 40 330 52 385 C55 398 60 408 70 412 C78 408 82 398 82 386 C82 340 88 300 92 280 Z" fill="var(--garment)"/>
         <path d="M74 404 C62 400 54 408 56 420 C58 434 72 442 84 438 C94 434 98 422 92 412 C88 406 80 404 74 404 Z" fill="var(--skin)"/>
       </g>`;

  return `
    <svg viewBox="0 0 220 620" preserveAspectRatio="xMidYMax meet">
      <ellipse cx="110" cy="606" rx="66" ry="9" fill="rgba(0,0,0,.16)"/>

      <!-- legs / lower garment -->
      <path d="M66 452 L154 452 L172 600 L48 600 Z" fill="var(--garment-dark)"/>

      <!-- feet peeking out from under the hem -->
      <ellipse cx="90" cy="600" rx="17" ry="9" fill="#2a1c12"/>
      <ellipse cx="130" cy="600" rx="17" ry="9" fill="#2a1c12"/>
      <rect x="80" y="592" width="20" height="5" rx="2.5" fill="var(--garment-trim)"/>
      <rect x="120" y="592" width="20" height="5" rx="2.5" fill="var(--garment-trim)"/>

      <!-- torso robe -->
      <path d="M58 460 Q52 330 70 262 Q90 244 110 244 Q130 244 150 262 Q168 330 162 460 Q110 484 58 460 Z" fill="var(--garment)"/>
      <path d="M92 250 L110 288 L128 250" stroke="var(--garment-trim)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="110" cy="320" r="3.2" fill="var(--garment-trim)"/>
      <circle cx="110" cy="360" r="3.2" fill="var(--garment-trim)"/>
      <circle cx="110" cy="400" r="3.2" fill="var(--garment-trim)"/>

      ${hijabBack}

      <!-- neck (proportional, not too thin) -->
      <rect x="88" y="216" width="44" height="46" rx="12" fill="var(--skin-shadow)"/>

      <!-- ears -->
      <ellipse cx="55" cy="182" rx="11" ry="15" fill="var(--skin-shadow)"/>
      <ellipse cx="165" cy="182" rx="11" ry="15" fill="var(--skin-shadow)"/>

      <!-- head -->
      <circle cx="110" cy="172" r="52" fill="var(--skin)"/>

      ${beard}
      ${blush}

      <!-- mouth -->
      <path class="mouth" d="M92 202 Q110 213 128 202" stroke="#5a3a28" stroke-width="3.6" fill="none" stroke-linecap="round"/>

      <!-- nose -->
      <path d="M110 154 Q116 170 108 178 Q113 182 120 178" stroke="var(--skin-shadow)" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- eyebrows -->
      ${browPath}

      <!-- eyes -->
      <g class="eye"><ellipse cx="88" cy="158" rx="${eyeRx}" ry="${eyeRy}" fill="#fbf8f2"/><circle class="pupil" cx="88" cy="158" r="5.2"/><circle cx="90" cy="155.2" r="1.5" fill="#fff"/></g>
      <g class="eye"><ellipse cx="132" cy="158" rx="${eyeRx}" ry="${eyeRy}" fill="#fbf8f2"/><circle class="pupil" cx="132" cy="158" r="5.2"/><circle cx="134" cy="155.2" r="1.5" fill="#fff"/></g>
      ${lashes}

      ${peci}
      ${hijabDrape}

      <!-- relaxed outer arm (drawn on top of the robe so the hand stays visible) -->
      ${relaxedArm}

      <!-- pointing arm (default pose, hides while covering eyes) -->
      ${pointingArm}

      <!-- hands: hidden at rest, rise to cover eyes when password is focused -->
      <g class="hand hand-left"><ellipse cx="100" cy="372" rx="22" ry="27" fill="var(--skin)"/></g>
      <g class="hand hand-right"><ellipse cx="120" cy="372" rx="22" ry="27" fill="var(--skin)"/></g>
    </svg>`;
}

document.getElementById('char-woman').innerHTML = buildCharacter('woman');
document.getElementById('char-man').innerHTML = buildCharacter('man');

document.getElementById('char-woman').style.setProperty('--headwear', '#c9a84c');
document.getElementById('char-woman').style.setProperty('--garment', '#e8c46a');
document.getElementById('char-woman').style.setProperty('--garment-trim', '#0f3d24');
document.getElementById('char-woman').style.setProperty('--garment-dark', '#c9a84c');
document.getElementById('char-woman').style.setProperty('--skin', '#c98a5b');
document.getElementById('char-woman').style.setProperty('--skin-shadow', '#a96b3e');

document.getElementById('char-man').style.setProperty('--headwear', '#241811');
document.getElementById('char-man').style.setProperty('--garment', '#4a3220');
document.getElementById('char-man').style.setProperty('--garment-trim', '#c9a84c');
document.getElementById('char-man').style.setProperty('--garment-dark', '#2e1f14');
document.getElementById('char-man').style.setProperty('--skin', '#c98a5b');
document.getElementById('char-man').style.setProperty('--skin-shadow', '#a96b3e');

// Height is based on the device's shorter physical dimension (min of width/height),
// which stays the same whether the phone is held upright or sideways — so the two
// characters stay the same size across both orientations instead of following the
// login card's height (which used to change slightly as its text reflowed).
function syncCharacterHeights(){
  const card = document.querySelector('.site-gate-box');
  const row = document.querySelector('.gate-row');
  const els = [document.getElementById('char-woman'), document.getElementById('char-man')];
  const rowW = row.clientWidth;
  const cardW = card.offsetWidth;
  const cardH = card.offsetHeight;
  const gapPx = parseFloat(getComputedStyle(row).gap) || 12;
  const availableForChars = Math.max(60, rowW - cardW - gapPx * 2);
  const perCharMaxW = availableForChars / 2;
  const aspect = 220 / 620;

  // Target height now follows the login card's own rendered height, so the
  // two characters line up with the form's edges whether the phone is held
  // upright or sideways (the card's height barely changes with orientation,
  // it's the character size that was drifting before).
  let targetH = cardH;
  let targetW = targetH * aspect;
  if (targetW > perCharMaxW) {
    targetW = perCharMaxW;
    targetH = targetW / aspect;
  }
  targetH = Math.min(targetH, window.innerHeight * 0.92);

  els.forEach(el => {
    el.style.height = targetH + 'px';
    el.style.width = targetW + 'px';
  });
}
window.addEventListener('load', syncCharacterHeights);
window.addEventListener('resize', syncCharacterHeights);
window.addEventListener('orientationchange', () => setTimeout(syncCharacterHeights, 200));
syncCharacterHeights();
setTimeout(syncCharacterHeights, 300);

const chars = [document.getElementById('char-woman'), document.getElementById('char-man')];
const userInput = document.getElementById('gateUser');
const passInput = document.getElementById('gatePass');
const form = document.getElementById('gate-form');
const btn = document.getElementById('gate-btn');
const status = document.getElementById('gate-status');
const hint = document.getElementById('hint-bubble');

let passFocused = false;
let hintDismissed = false;

setTimeout(() => { if (!hintDismissed) hint.classList.add('show'); }, 1800);

function dismissHint(){
  hintDismissed = true;
  hint.classList.remove('show');
}
userInput.addEventListener('focus', dismissHint);
passInput.addEventListener('focus', dismissHint);

function movePupils(dx, dy){
  const cx = Math.max(-4, Math.min(4, dx));
  const cy = Math.max(-3, Math.min(3, dy));
  chars.forEach(c => c.querySelectorAll('.pupil').forEach(p => {
    p.style.transform = `translate(${cx}px, ${cy}px)`;
  }));
}

document.addEventListener('mousemove', (e) => {
  if (passFocused) return;
  const rect = document.body.getBoundingClientRect();
  const dx = (e.clientX - rect.width/2) / 40;
  const dy = (e.clientY - rect.height/2) / 40;
  movePupils(dx, dy);
});

userInput.addEventListener('input', () => {
  if (passFocused) return;
  const ratio = userInput.value.length / 18;
  movePupils(-4 + ratio * 8, 1);
});

passInput.addEventListener('focus', () => {
  passFocused = true;
  chars.forEach(c => c.classList.add('covering'));
});
passInput.addEventListener('blur', () => {
  passFocused = false;
  chars.forEach(c => c.classList.remove('covering', 'peeking'));
  movePupils(0,0);
});

function applyState(cls){
  chars.forEach(c => {
    c.querySelectorAll('.hand-left').forEach(h => h.style.transform = cls === 'covering'
      ? 'translate(-14px,-196px) rotate(-8deg)'
      : cls === 'peeking'
      ? 'translate(-46px,-196px) rotate(-18deg)'
      : 'translate(0,0)');
    c.querySelectorAll('.hand-right').forEach(h => h.style.transform = cls === 'covering'
      ? 'translate(14px,-196px) rotate(8deg)'
      : cls === 'peeking'
      ? 'translate(46px,-196px) rotate(18deg)'
      : 'translate(0,0)');
  });
}

const observer = new MutationObserver(() => {
  chars.forEach(c => {
    if (c.classList.contains('peeking')) applyState('peeking');
    else if (c.classList.contains('covering')) applyState('covering');
    else applyState('rest');
  });
});
chars.forEach(c => observer.observe(c, { attributes:true, attributeFilter:['class'] }));

form.addEventListener('submit', (e) => {
  e.preventDefault();
  btn.classList.add('loading');
  btn.disabled = true;
  status.innerHTML = '';

  setTimeout(() => {
    btn.classList.remove('loading');
    btn.disabled = false;
    chars.forEach(c => c.classList.remove('covering', 'peeking'));
    chars.forEach(c => c.querySelectorAll('.mouth').forEach(m => m.setAttribute('d', 'M88 200 Q110 222 132 200')));
    status.innerHTML = '<div class="site-gate-ok">✅ Berhasil masuk. Selamat datang kembali!</div>';
  }, 1200);
});
</script>

</body>
</html>
