<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lupa Password - NAFA Tech Member Area</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">N</div>
      <div class="brand-name">NAFA Tech</div>
    </div>
    <h1 class="title">Lupa Password?</h1>
    <p class="subtitle">Masukkan email kamu, kami kirim link reset</p>

    <div id="alertBox" class="alert"></div>

    <form id="forgotForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Kirim Link Reset</button>
    </form>

    <p class="foot-link"><a href="login.html">← Kembali ke halaman login</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script>
    const form = document.getElementById('forgotForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'alert alert-' + type;
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Mengirim...';
      alertBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();

      // redirectTo: halaman tempat user bikin password baru setelah klik link di email
      const redirectUrl = window.location.origin + window.location.pathname.replace('forgot-password.html', 'update-password.html');

      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: redirectUrl
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Kirim Link Reset';

      if (error) {
        showAlert(error.message, 'error');
        return;
      }

      showAlert('Link reset password sudah dikirim ke email kamu. Cek inbox/spam.', 'success');
      form.reset();
    });
  </script>
</body>
</html>
