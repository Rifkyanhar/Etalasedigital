<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin - NAFA Tech Member Area</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body { display: block; padding: 24px 14px 60px; }
  [hidden] { display: none !important; }
  .ad-wrap { width: 100%; max-width: 920px; margin: 0 auto; color: #111827; }
  .ad-card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(15, 23, 42, .06); }
  .ad-top { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ad-top h1 { font-size: 20px; margin: 0; }
  .ad-sub { font-size: 13.5px; color: #6b7280; margin: 4px 0 0; }
  .ad-links a, .ad-links button {
    font-size: 13.5px; font-weight: 600; color: #2563eb; text-decoration: none; background: none;
    border: none; cursor: pointer; margin-left: 12px; padding: 0;
  }
  .ad-tabs { display: flex; gap: 8px; margin: 14px 0; }
  .ad-tab {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #d1d5db; background: #fff;
    font-size: 14.5px; font-weight: 700; cursor: pointer; color: #374151;
  }
  .ad-tab.on { background: #2563eb; border-color: #2563eb; color: #fff; }
  .ad-search { width: 100%; padding: 11px 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; margin-bottom: 12px; }

  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #f3f4f6; color: #374151; margin-right: 6px; }
  .badge.ok { background: #dcfce7; color: #166534; }
  .badge.warn { background: #fef3c7; color: #92400e; }
  .badge.bad { background: #fee2e2; color: #991b1b; }
  .badge.info { background: #dbeafe; color: #1e40af; }

  .ord { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .ord-name { font-weight: 700; font-size: 15px; }
  .ord-line { font-size: 13.5px; color: #4b5563; margin-top: 4px; line-height: 1.5; word-break: break-word; }
  .ord-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 1px solid #d1d5db; background: #fff; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: #16a34a; border-color: #16a34a; color: #fff; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .box { margin-top: 12px; padding: 12px; background: #f9fafb; border-radius: 10px; }
  .box label { display: block; font-size: 12.5px; font-weight: 600; color: #6b7280; margin: 10px 0 4px; }
  .box label:first-child { margin-top: 0; }
  .box input, .box select, .box textarea {
    width: 100%; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 8px;
    font-size: 14.5px; font-family: inherit; background: #fff; color: #111827;
  }
  .box textarea { min-height: 70px; resize: vertical; }
  .hint { font-size: 12.5px; color: #92400e; background: #fef3c7; padding: 8px 10px; border-radius: 8px; margin-bottom: 8px; line-height: 1.5; }
  .msg { font-size: 13px; margin-top: 8px; }
  .msg.ok { color: #166534; }
  .msg.err { color: #991b1b; }
  .missing { color: #b45309; font-weight: 600; }
  .tk { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .tk-text { white-space: pre-wrap; font-size: 14px; margin: 8px 0 0; line-height: 1.5; }
  .denied { color: #991b1b; font-size: 15px; line-height: 1.6; }
</style>
</head>
<body>
  <div id="loading" class="loading-screen">Memuat...</div>

  <div id="denied" class="ad-wrap" hidden>
    <div class="ad-card">
      <p class="denied">Akun ini tidak punya akses admin. Masuk memakai akun admin yang terdaftar, atau hubungi pemilik.</p>
      <p class="ad-links" style="margin-top:12px;"><a href="dashboard.html" style="margin-left:0;">Kembali ke dashboard</a><button id="deniedLogout">Keluar</button></p>
    </div>
  </div>

  <div id="app" class="ad-wrap" hidden>
    <div class="ad-card">
      <div class="ad-top">
        <div>
          <h1>Admin Member Area</h1>
          <p class="ad-sub" id="adminEmail"></p>
        </div>
        <div class="ad-links"><a href="dashboard.html">Dashboard member</a><button id="logoutBtn">Keluar</button></div>
      </div>
      <div class="ad-tabs">
        <button class="ad-tab on" id="tabOrders" type="button">Pesanan</button>
        <button class="ad-tab" id="tabTickets" type="button">Tiket <span id="tkCount"></span></button>
      </div>

      <div id="paneOrders">
        <input class="ad-search" id="search" placeholder="Cari nama, WhatsApp, email, layanan, atau nomor antrian">
        <div id="ordersList">Memuat pesanan...</div>
      </div>
      <div id="paneTickets" hidden>
        <div id="ticketsList">Memuat tiket...</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const STATUS = { waiting: ['Antrian', 'warn'], in_progress: ['Progress', 'info'], done: ['Selesai', 'ok'], cancelled: ['Dibatalkan', 'bad'] };
    const PAY = { unpaid: 'Belum dibayar', pending: 'Menunggu bayar', verifying: 'Verifikasi', paid: 'Lunas', failed: 'Gagal', expired: 'Kedaluwarsa' };
    const TK_STATUS = { open: 'Menunggu', in_progress: 'Diproses', resolved: 'Selesai' };

    // [kolom, label, jenis input, tampil untuk tipe apa saja]
    const HO_FIELDS = [
      ['product_name', 'Jenis produk / layanan yang dibeli', 'text', ['langganan', 'resto_qr', 'otp', 'lainnya']],
      ['github_repo', 'Nama repo GitHub', 'text', ['langganan']],
      ['domain_name', 'Nama domain (mis. namausaha.com)', 'text', ['otp']],
      ['product_login', 'Login produk (email / username)', 'text', ['otp']],
      ['product_password', 'Password login produk', 'text', ['otp']],
      ['kitchen_email', 'Email dapur', 'text', ['resto_qr']],
      ['kitchen_password', 'Password dapur', 'text', ['resto_qr']],
      ['cashier_email', 'Email kasir', 'text', ['resto_qr']],
      ['cashier_password', 'Password kasir', 'text', ['resto_qr']],
      ['notes', 'Catatan untuk pelanggan', 'textarea', ['langganan', 'resto_qr', 'otp', 'lainnya']]
    ];

    let ORDERS = [];

    function el(tag, className, text) {
      const n = document.createElement(tag);
      if (className) n.className = className;
      if (text !== undefined && text !== null) n.textContent = text;
      return n;
    }
    function fmtDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      return isNaN(d) ? '' : d.toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function setMsg(node, ok, text) { node.className = 'msg ' + (ok ? 'ok' : 'err'); node.textContent = text; }

    // ---------- Pesanan ----------
    function renderOrders() {
      const q = $('search').value.trim().toLowerCase();
      const box = $('ordersList');
      box.textContent = '';
      const rows = ORDERS.filter(o => !q || [o.customer_name, o.contact, o.customer_email, o.service_name, String(o.queue_number)]
        .join(' ').toLowerCase().includes(q));
      if (rows.length === 0) { box.textContent = 'Tidak ada pesanan yang cocok.'; return; }
      rows.forEach(o => box.appendChild(orderCard(o)));
    }

    function orderCard(o) {
      const card = el('div', 'ord');
      card.appendChild(el('div', 'ord-name', '#' + o.queue_number + ' · ' + (o.customer_name || '-')));
      const st = STATUS[o.status] || [o.status, ''];
      const badges = el('div', 'ord-line');
      badges.appendChild(el('span', 'badge ' + st[1], st[0]));
      badges.appendChild(el('span', 'badge', PAY[o.payment_status] || o.payment_status));
      if (o.has_handover) badges.appendChild(el('span', 'badge ok', 'Serah terima terisi'));
      card.appendChild(badges);
      card.appendChild(el('div', 'ord-line', (o.service_name || '-') + ' · WA: ' + (o.contact || '-')));
      if (o.domain_name) card.appendChild(el('div', 'ord-line', 'Domain dipesan: ' + o.domain_name + (o.domain_ext || '')));

      const emailLine = el('div', 'ord-line');
      if (o.customer_email) emailLine.textContent = 'Email akun: ' + o.customer_email;
      else { emailLine.className = 'ord-line missing'; emailLine.textContent = 'Email akun belum diisi (pesanan belum tampil di akun member)'; }
      card.appendChild(emailLine);

      const actions = el('div', 'ord-actions');
      const btnEmail = el('button', 'btn', o.customer_email ? 'Ubah email' : 'Isi email');
      const btnHo = el('button', 'btn primary', 'Serah terima');
      btnEmail.type = 'button'; btnHo.type = 'button';
      actions.appendChild(btnEmail); actions.appendChild(btnHo);
      card.appendChild(actions);

      const slot = el('div');
      card.appendChild(slot);

      btnEmail.addEventListener('click', () => { slot.textContent = ''; slot.appendChild(emailForm(o)); });
      btnHo.addEventListener('click', async () => { slot.textContent = ''; slot.appendChild(await handoverForm(o)); });
      return card;
    }

    function emailForm(o) {
      const box = el('div', 'box');
      box.appendChild(el('label', null, 'Email akun member pelanggan (harus sama dengan email saat mereka mendaftar)'));
      const inp = el('input'); inp.type = 'email'; inp.value = o.customer_email || ''; inp.placeholder = 'nama@email.com';
      box.appendChild(inp);
      const save = el('button', 'btn primary', 'Simpan email'); save.type = 'button'; save.style.marginTop = '10px';
      const msg = el('div', 'msg');
      save.addEventListener('click', async () => {
        save.disabled = true;
        const { error } = await supabaseClient.rpc('admin_set_order_email', { p_order_id: o.id, p_email: inp.value });
        save.disabled = false;
        if (error) { setMsg(msg, false, 'Gagal: ' + error.message); return; }
        o.customer_email = inp.value.trim().toLowerCase() || null;
        setMsg(msg, true, 'Email tersimpan.');
        renderOrders();
      });
      box.appendChild(save); box.appendChild(msg);
      return box;
    }

    async function handoverForm(o) {
      const box = el('div', 'box');
      if (o.status !== 'done') {
        box.appendChild(el('div', 'hint', 'Status pesanan ini belum Selesai. Rincian serah terima baru tampil ke pelanggan setelah status diubah jadi Selesai di dashboard CRM.'));
      }
      if (!o.customer_email) {
        box.appendChild(el('div', 'hint', 'Email akun pelanggan belum diisi, jadi pelanggan belum bisa melihat pesanan ini. Isi dulu lewat tombol "Isi email".'));
      }
      const { data: cur } = await supabaseClient.rpc('admin_get_handover', { p_order_id: o.id });
      const h = (cur && cur[0]) || {};

      box.appendChild(el('label', null, 'Tipe serah terima'));
      const typeSel = el('select');
      [['', '— Pilih tipe —'], ['langganan', 'Langganan (repo GitHub)'], ['resto_qr', 'Web App Resto QR (akun dapur & kasir)'],
        ['otp', 'Produk sekali bayar / OTP (domain & login)'], ['lainnya', 'Lainnya']].forEach(([v, t]) => {
        const op = el('option', null, t); op.value = v; typeSel.appendChild(op);
      });
      typeSel.value = h.handover_type || '';
      box.appendChild(typeSel);

      const inputs = {};
      const wraps = [];
      HO_FIELDS.forEach(([key, label, kind, types]) => {
        const w = el('div');
        w.appendChild(el('label', null, label));
        const i = kind === 'textarea' ? el('textarea') : el('input');
        if (kind !== 'textarea') i.type = 'text';
        i.value = h[key] || '';
        i.autocomplete = 'off';
        inputs[key] = i;
        w.appendChild(i);
        box.appendChild(w);
        wraps.push([w, types]);
      });
      const refresh = () => wraps.forEach(([w, types]) => { w.hidden = !types.includes(typeSel.value); });
      typeSel.addEventListener('change', refresh);
      refresh();

      box.appendChild(el('div', 'hint', 'Password yang kamu isi di sini tersimpan sebagai teks biasa dan tampil ke pelanggan. Pakai password awal sementara, jangan password akun GitHub atau email pribadimu.'));

      const save = el('button', 'btn primary', 'Simpan serah terima'); save.type = 'button';
      const msg = el('div', 'msg');
      save.addEventListener('click', async () => {
        if (!typeSel.value) { setMsg(msg, false, 'Pilih tipe serah terima dulu.'); return; }
        const data = { handover_type: typeSel.value };
        HO_FIELDS.forEach(([key, , , types]) => { data[key] = types.includes(typeSel.value) ? inputs[key].value : ''; });
        save.disabled = true;
        const { error } = await supabaseClient.rpc('admin_save_handover', { p_order_id: o.id, p_data: data });
        save.disabled = false;
        if (error) { setMsg(msg, false, 'Gagal: ' + error.message); return; }
        o.has_handover = true;
        setMsg(msg, true, 'Serah terima tersimpan.');
      });
      box.appendChild(save); box.appendChild(msg);
      return box;
    }

    async function loadOrders() {
      const { data, error } = await supabaseClient.rpc('admin_list_orders');
      if (error) { $('ordersList').textContent = 'Gagal memuat pesanan: ' + error.message; return; }
      ORDERS = data || [];
      renderOrders();
    }

    // ---------- Tiket ----------
    async function loadTickets() {
      const { data, error } = await supabaseClient.rpc('admin_list_tickets');
      const box = $('ticketsList');
      if (error) { box.textContent = 'Gagal memuat tiket: ' + error.message; return; }
      box.textContent = '';
      const open = (data || []).filter(t => t.status !== 'resolved').length;
      $('tkCount').textContent = open ? '(' + open + ')' : '';
      if (!data || data.length === 0) { box.textContent = 'Belum ada tiket.'; return; }
      data.forEach(t => box.appendChild(ticketCard(t)));
    }

    function ticketCard(t) {
      const card = el('div', 'tk');
      card.appendChild(el('div', 'ord-name', t.subject));
      card.appendChild(el('div', 'ord-line', t.user_email + ' · ' + fmtDate(t.created_at) +
        (t.order_queue ? ' · Pesanan #' + t.order_queue + ' (' + (t.customer_name || '-') + ')' : '')));
      card.appendChild(el('p', 'tk-text', t.message));

      const box = el('div', 'box');
      box.appendChild(el('label', null, 'Status'));
      const sel = el('select');
      Object.entries(TK_STATUS).forEach(([v, l]) => { const op = el('option', null, l); op.value = v; sel.appendChild(op); });
      sel.value = t.status;
      box.appendChild(sel);
      box.appendChild(el('label', null, 'Balasan untuk pelanggan (tampil di dashboard mereka)'));
      const reply = el('textarea'); reply.value = t.admin_reply || '';
      box.appendChild(reply);
      const save = el('button', 'btn primary', 'Simpan balasan'); save.type = 'button'; save.style.marginTop = '10px';
      const msg = el('div', 'msg');
      save.addEventListener('click', async () => {
        save.disabled = true;
        const { error } = await supabaseClient.rpc('admin_reply_ticket', { p_ticket_id: t.id, p_status: sel.value, p_reply: reply.value });
        save.disabled = false;
        if (error) { setMsg(msg, false, 'Gagal: ' + error.message); return; }
        setMsg(msg, true, 'Tersimpan.');
      });
      box.appendChild(save); box.appendChild(msg);
      card.appendChild(box);
      return card;
    }

    // ---------- Tab & mulai ----------
    function showTab(name) {
      const isOrders = name === 'orders';
      $('paneOrders').hidden = !isOrders;
      $('paneTickets').hidden = isOrders;
      $('tabOrders').classList.toggle('on', isOrders);
      $('tabTickets').classList.toggle('on', !isOrders);
    }
    $('tabOrders').addEventListener('click', () => showTab('orders'));
    $('tabTickets').addEventListener('click', () => showTab('tickets'));
    $('search').addEventListener('input', renderOrders);

    async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'login.html'; }
    $('logoutBtn').addEventListener('click', logout);
    $('deniedLogout').addEventListener('click', logout);

    (async () => {
      const { data } = await supabaseClient.auth.getSession();
      if (!data.session) { window.location.href = 'login.html'; return; }
      $('adminEmail').textContent = data.session.user.email;

      const { data: isAdmin, error } = await supabaseClient.rpc('is_member_admin');
      $('loading').style.display = 'none';
      if (error || isAdmin !== true) { $('denied').hidden = false; return; }

      $('app').hidden = false;
      loadOrders();
      loadTickets();
    })();
  </script>
</body>
</html>
