<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard - NAFA Tech Member Area</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body { align-items: flex-start; padding-top: 40px; }
</style>
</head>
<body>
  <div id="loadingScreen" class="loading-screen">Memuat...</div>

  <div id="dashContent" class="dash-wrap" style="display:none;">
    <div class="dash-card">
      <div class="dash-header">
        <h1>Halo, <span id="userName">Member</span> 👋</h1>
        <button class="btn-logout" id="logoutBtn">Keluar</button>
      </div>
      <p class="user-email" id="userEmail"></p>
    </div>

    <div class="dash-card">
      <p style="margin:0; color:var(--text-dark);">
        Ini adalah member area kamu. Konten, produk, atau fitur khusus member
        bisa ditambahkan di sini.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script>
    (async () => {
      const { data } = await supabaseClient.auth.getSession();

      if (!data.session) {
        window.location.href = 'login.html';
        return;
      }

      const user = data.session.user;
      document.getElementById('userName').textContent =
        (user.user_metadata && user.user_metadata.full_name) || 'Member';
      document.getElementById('userEmail').textContent = user.email;

      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('dashContent').style.display = 'block';
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    });

    // Auto-redirect kalau session berubah jadi logout dari tab lain
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_OUT') window.location.href = 'login.html';
    });
  </script>
</body>
</html>
