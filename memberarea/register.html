<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftar - NAFA Tech Member Area</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">N</div>
      <div class="brand-name">NAFA Tech</div>
    </div>
    <h1 class="title">Buat Akun Baru</h1>
    <p class="subtitle">Daftar untuk mengakses member area</p>

    <div id="alertBox" class="alert"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName">Nama Lengkap</label>
        <input type="text" id="fullName" required placeholder="Nama kamu">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" placeholder="Minimal 6 karakter">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">Daftar</button>
    </form>

    <p class="foot-link">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = 'alert alert-' + type;
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memproses...';
      alertBox.style.display = 'none';

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { full_name: fullName }
        }
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Daftar';

      if (error) {
        showAlert(error.message, 'error');
        return;
      }

      showAlert('Pendaftaran berhasil! Cek email kamu untuk verifikasi, lalu login.', 'success');
      form.reset();
      setTimeout(() => { window.location.href = 'login.html'; }, 2500);
    });
  </script>
</body>
</html>
